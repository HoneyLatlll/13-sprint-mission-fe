<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link href="../Css/login.css" rel="stylesheet" />
    <link href="../Css/reset.css" rel="stylesheet" />
  </head>
  <body>
    <main class="main-container signup">
      <div class="login-box">
        <span class="login-logo">
          <a href="../" class="login-logo-img"
            ><img src="../IconImg/로그인 판다 얼굴.svg" alt="로그인 판다 얼굴"
          /></a>
          판다 마켓
        </span>
        <div class="login-box-main">
          <p label for="userEmail">이메일</p>
          <input
            type="email"
            placeholder="이메일을 입력하세요"
            id="userEmail"
            class="login-input"
          />
          <p label for="userNickname">닉네임</p>
          <input
            type="text"
            placeholder="닉네임을 입력하세요"
            id="userNickname"
            class="login-input"
          />
          <p label for="userPassword">비밀번호</p>
          <div class="login-input-password">
            <input
              type="password"
              placeholder="비밀번호를 입력하세요"
              id="userPassword"
              class="login-input"
            />
            <button type="button" class="visible-btn">
              <img src="../IconImg/ic_visibillity.svg" />
            </button>
          </div>
          <p label for="checkPassword">비밀번호 확인</p>
          <div class="login-input-password">
            <input
              type="password"
              placeholder="비밀번호를 다시 한 번 입력하세요"
              id="checkPassword"
              class="login-input"
            />
            <button type="button" class="visible-btn">
              <img src="../IconImg/ic_visibillity.svg" />
            </button>
          </div>
          <button type="button" class="login-button">로그인</button>

          <div class="easy-login">
            <p>간편 로그인하기</p>
            <span class="easy-login-logobox">
              <a
                href="https://www.google.com/webhp?hl=ko&sa=X&ved=0ahUKEwjsy7_xgsmTAxX6cfUHHeeDHb4QPAgJ"
                target="_blank"
              >
                <img src="../IconImg/ic_google.png" />
              </a>
              <a href="https://www.kakaocorp.com/page/" target="_blank">
                <img src="../IconImg/ic_kakaotalk.svg" />
              </a>
            </span>
          </div>
          <span class="login-bottom-textbox">
            <p>이미 회원이신가요?</p>
            <a href="./login.html"> 로그인 </a>
          </span>
        </div>
      </div>
    </main>
  </body>
</html>
