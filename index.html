<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link href="./Css/reset.css" rel="stylesheet" />
    <link href="./Css/landing.css" rel="stylesheet" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <span class="logo-name">
          <a href="./"
            ><img
              src="./IconImg/판다 얼굴.svg"
              alt="판다 얼굴"
              class="logo-img"
          /></a>
          판다 마켓
        </span>
        <a href="./Html/login.html" class="login-a">
          <button type="button" class="login-button">로그인</button>
        </a>
      </div>
    </header>
    <main class="main">
      <section class="common-section">
        <div class="common-group">
          <div class="common-group-box">
            <span class="common-view-text"
              >일상의 모든 물건을 거래해 보세요</span
            >
            <a href="./Html/items.html" class="items-a">
              <button class="header-view-button">
                <p class="header-view-button-p">구경하러 가기</p>
              </button>
            </a>
          </div>
          <img src="./Img/panda.jpg" alt="판다사진" class="common-group-img" />
        </div>
      </section>
      <section class="main-section">
        <div class="item-box">
          <img src="./Img/HotItem.jpg" alt="인기상품확인" class="item-img" />
          <div class="item-present">
            <span class="item-text-title">Hot item</span>
            <span class="item-text-middle"
              >인기 상품을 <br />확인해 보세요</span
            >
            <span class="item-text-bottom"
              >가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요</span
            >
          </div>
        </div>
      </section>
      <section class="main-section">
        <div class="item-box">
          <div class="item-present">
            <span class="item-text-title">Search</span>
            <span class="item-text-middle"
              >구매를 원하는 <br />상품을 검색하세요</span
            >
            <span class="item-text-bottom"
              >구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</span
            >
          </div>
          <img src="./Img/searchitem.jpg" alt="상품검색" class="item-img" />
        </div>
      </section>
      <section class="main-section">
        <div class="item-box">
          <img src="./Img/registeritem.jpg" alt="상품등록" class="item-img" />
          <div class="item-present">
            <span class="item-text-title">Register</span>
            <span class="item-text-middle"
              >판매를 원하는<br />
              상품을 등록하세요</span
            >
            <span class="item-text-bottom"
              >어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</span
            >
          </div>
        </div>
      </section>
    </main>
    <footer>
      <section class="common-section footer">
        <div class="common-group">
          <div class="common-group-box">
            <span class="common-view-text"
              >믿을 수 있는 <br />
              판다마켓 중고 거래</span
            >
          </div>
          <img
            src="./Img/panda2.jpg"
            alt="판다사진2"
            class="common-group-img tall"
          />
        </div>
      </section>
      <section class="footer-section">
        <div class="footer-span-box">
          <span class="footer-first-text"> @codeit - 2024 </span>
          <div class="footer-center-box">
            <a href="./Html/privacy.html" class="privacy-a">Privacy Policy</a>
            <a href="./Html/faq.html" class="FAQ-a"> FAQ</a>
          </div>
          <div class="footer-icon-box">
            <a href="https://www.facebook.com/?locale=ko_KR" target="_blank">
              <img src="./IconImg/ic_facebook.svg" />
            </a>
            <a href="https://x.com/?lang=ko" target="_blank">
              <img src="./IconImg/ic_twitter.svg" />
            </a>
            <a
              href="https://www.youtube.com/?app=desktop&hl=ko&gl=KR"
              target="_blank"
            >
              <img src="./IconImg/ic_youtube.svg" />
            </a>
            <a href="https://www.instagram.com/?hl=ko" target="_blank">
              <img src="./IconImg/ic_instagram.svg" />
            </a>
          </div>
        </div>
      </section>
    </footer>
  </body>
</html>
